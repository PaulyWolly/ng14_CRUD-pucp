<h1 *ngIf="!editData" mat-dialog-title>Add Country</h1>
<h1 *ngIf="editData" mat-dialog-title>Update Country</h1>

<div mat-dialog-content>
  <form [formGroup]="countryForm">
    <mat-form-field appearance="outline">
      <mat-label>Country Name</mat-label>
      <input matInput formControlName="name" placeholder="Name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Shorthand Code</mat-label>
      <input matInput formControlName="code" placeholder="e.g. US">
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions [align]="'end'">
  <button mat-raised-button color="warn" mat-dialog-close>Close</button>
  <button type="button"
          style="margin-left: 8px;"
          mat-raised-button
          color="primary"
          [disabled]="countryForm.invalid"
          (click)="saveCountry()">{{ actionBtn }}</button>
</div>
