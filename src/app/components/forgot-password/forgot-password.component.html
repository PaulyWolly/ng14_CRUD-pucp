<mat-card>
  <mat-card-header>
    <h2>Forgot Password</h2>
  </mat-card-header>
  <mat-card-content>

    <ng-container *ngIf="step === 'verify'">
      <p class="hint">Enter your username and the email on your account to verify your identity.</p>
      <form class="example-form" [formGroup]="verifyForm" (ngSubmit)="verifyIdentity()">
        <mat-form-field class="example-full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="id">
        </mat-form-field>
        <br><br>
        <mat-form-field class="example-full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
        </mat-form-field>
        <div>
          <button mat-raised-button color="primary" type="submit">Verify</button>
          &nbsp;
          <a routerLink="/login" mat-raised-button color="accent">Back to Login</a>
        </div>
      </form>
    </ng-container>

    <ng-container *ngIf="step === 'reset'">
      <p class="hint">Choose a new password for <strong>{{ verifiedUser?.id }}</strong>.</p>
      <form class="example-form" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
        <mat-form-field class="example-full-width">
          <mat-label>New Password</mat-label>
          <input matInput type="password" formControlName="password">
        </mat-form-field>
        <br><br>
        <mat-form-field class="example-full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" formControlName="confirmPassword">
        </mat-form-field>
        <div>
          <button mat-raised-button color="primary" type="submit">Reset Password</button>
          &nbsp;
          <a routerLink="/login" mat-raised-button color="accent">Back to Login</a>
        </div>
      </form>
    </ng-container>

  </mat-card-content>
</mat-card>
